<title>Tap Trading — Locked</title>
<style>
  :root{--bg:#0a0e17;--card:#121826;--stroke:#243049;--muted:#8b97ad;--accent:#1f8fe6}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 50% -10%,#16203a 0%,#0a0e17 55%);color:#e7ecf5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:22px}
  .gate{width:340px;max-width:92vw;background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:26px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:18px}.brand .g{color:var(--accent)}
  .lock{font-size:30px;text-align:center;margin:4px 0 10px}
  h1{font-size:17px;margin:0 0 6px;text-align:center}
  p.sub{margin:0 0 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
  input[type=password]{width:100%;background:#0c111d;border:1px solid var(--stroke);color:#fff;border-radius:12px;padding:13px 14px;font-size:15px;outline:none;letter-spacing:.4px}
  input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,143,230,.18)}
  .row{display:flex;align-items:center;gap:8px;margin:13px 2px 18px;color:var(--muted);font-size:12.5px}
  button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(180deg,#2c9cf0,#1f8fe6);cursor:pointer}
  button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:default}
  .err{color:#ff6f8a;font-size:13px;text-align:center;min-height:18px;margin-top:12px}
  .valid{color:#5d6b85;font-size:11.5px;text-align:center;margin-top:14px}
</style></head>

async function decrypt(pw){

  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);

async function tryUnlock(pw,fromStore){
